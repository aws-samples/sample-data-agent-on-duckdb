# Allowlist for public, non-secret constants that trip entropy-based rules.
# Scope is deliberately narrow: EVM addresses are 0x + 40 hex — shape-
# distinguishable from private keys (0x + 64 hex), which stay flagged.
[extend]
useDefault = true

[allowlist]
description = "Public on-chain constants (Ethereum addresses in demo label data and docs)"
regexes = [
    '''0x[0-9a-fA-F]{40}\b''',  # EVM account addresses — public chain data, cannot be a key
]
# One historical commit briefly carried a detect-secrets baseline; its
# "hashed_secret" values are SHA-1 digests of the golden-cache keys (hex
# digests of golden SQL), not credentials. The file was removed in the next
# commit; this pins the exception to that commit only.
commits = [
    "20e07328ddaf9f911fd67353dd222ab11cb240cd",  # pragma: allowlist secret - a commit id
]
