# Allowlist for public, non-secret constants that trip entropy-based rules.
# Scope is deliberately narrow: EVM addresses are 0x + 40 hex — shape-
# distinguishable from private keys (0x + 64 hex), which stay flagged.
[extend]
useDefault = true

[allowlist]
description = "Public on-chain constants (Ethereum addresses in demo label data and docs)"
regexes = [
    '''0x[0-9a-fA-F]{40}\b''',  # EVM account addresses — public chain data, cannot be a key
]
