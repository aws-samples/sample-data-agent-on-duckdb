[project]
name = "sample-data-agent-on-duckdb"
version = "0.1.0"
description = "Data-analyst agent with an in-process DuckDB engine on Amazon Bedrock AgentCore"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5,<1.6",
    "strands-agents",
    "bedrock-agentcore",
    "boto3",
    "sqlglot",
    "PyJWT",
    "mcp>=1.29,<2",
]

[dependency-groups]
dev = ["pytest", "ruff", "PyYAML"]  # PyYAML: scripts/run_eval.py case files

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
