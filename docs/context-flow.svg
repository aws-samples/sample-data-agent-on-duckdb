<text x="46" y="528" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6B7B">after it runs</text>
<rect x="24" y="880" width="1352" height="105" rx="10" fill="#FFFFFF" stroke="#E6ECF2"/>
<rect x="24" y="880" width="6" height="105" rx="3" fill="#3B4A5A"/>
<text x="46" y="910" text-anchor="start" font-size="13" font-weight="800" fill="#16202E">History compression</text>
<text x="46" y="928" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6B7B">across turns</text>
