<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Context layer: the path of one statement">
<title>Context layer — the path of one statement</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1400" height="1000" fill="#FBFCFE"/>
<text x="40" y="36" text-anchor="start" font-size="20" font-weight="800" fill="#16202E">Context layer — the path of one statement</text>
<text x="40" y="58" text-anchor="start" font-size="11.5" font-weight="400" fill="#5A6B7B">the statement pipeline in the order it acts · solid = the statement and its result · dashed = a pointer into the engine, no data moves · Gateway rows land the same way</text>
<rect x="24" y="95" width="1352" height="95" rx="10" fill="#FFFFFF" stroke="#E6ECF2"/>
<rect x="24" y="95" width="6" height="95" rx="3" fill="#00A4A6"/>
<text x="46" y="125" text-anchor="start" font-size="13" font-weight="800" fill="#16202E">Data map</text>
<text x="46" y="143" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6B7B">before the SQL exists</text>
<rect x="24" y="200" width="1352" height="270" rx="10" fill="#FFFFFF" stroke="#E6ECF2"/>
<rect x="24" y="200" width="6" height="270" rx="3" fill="#E0A82E"/>
<text x="46" y="230" text-anchor="start" font-size="13" font-weight="800" fill="#16202E">Before it runs</text>
<text x="46" y="248" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6B7B">L2 · L4 · cost gate</text>
<rect x="24" y="480" width="1352" height="390" rx="10" fill="#FFFFFF" stroke="#E6ECF2"/>
<rect x="24" y="480" width="6" height="390" rx="3" fill="#8C4FFF"/>
<text x="46" y="510" text-anchor="start" font-size="13" font-weight="800" fill="#16202E">Result shaping</text>
<text x="46" y="528" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6B7B">after it runs · owner-bound handles</text>
<rect x="24" y="880" width="1352" height="105" rx="10" fill="#FFFFFF" stroke="#E6ECF2"/>
<rect x="24" y="880" width="6" height="105" rx="3" fill="#3B4A5A"/>
<text x="46" y="910" text-anchor="start" font-size="13" font-weight="800" fill="#16202E">History compression</text>
<text x="46" y="928" text-anchor="start" font-size="10.5" font-weight="400" fill="#5A6B7B">across turns</text>
<rect x="215.0" y="118.0" width="110" height="44" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.4"/>
<text x="270" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">question</text>
<rect x="370.0" y="112.0" width="380" height="56" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.4"/>
<text x="560" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">Data map</text>
<text x="560" y="154" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">L0 table map + cards in the prompt · search_schema (BM25, cards) · DESCRIBE on demand</text>
<rect x="785.0" y="116.0" width="190" height="48" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.4"/>
<text x="880" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">Claude writes SQL</text>
<rect x="410.0" y="190.0" width="300" height="52" rx="10" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.4"/>
<text x="560" y="213" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">call_verified / call_metric (L2)</text>
<text x="560" y="230" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">reviewed SQL · parameters bound · allow-listed</text>
<rect x="730.0" y="236.0" width="300" height="44" rx="10" fill="#FDECEE" stroke="#DD344C" stroke-width="1.4"/>
<text x="880" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">Governance rewrite (L4)</text>
<text x="880" y="272" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">RLS / CLS compiled into the statement</text>
<rect x="745.0" y="302.0" width="270" height="56" rx="28.0" fill="#FFF4DC" stroke="#E0A82E" stroke-width="1.4"/>
<text x="880" y="327" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">Cost gate</text>
<text x="880" y="344" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">raw partitioned source?</text>
<rect x="380.0" y="403.0" width="240" height="44" rx="10" fill="#FDECEE" stroke="#DD344C" stroke-width="1.4"/>
<text x="500" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">rejected before the engine</text>
<rect x="735.0" y="403.0" width="290" height="44" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.4"/>
<text x="880" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">expanded to explicit partition paths</text>
<rect x="760.0" y="506.0" width="240" height="48" rx="10" fill="#FFF9C4" stroke="#E6C300" stroke-width="1.4"/>
<text x="880" y="535" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">DuckDB executes in-process</text>
<rect x="780.0" y="606.0" width="200" height="48" rx="24.0" fill="#FFF4DC" stroke="#E0A82E" stroke-width="1.4"/>
<text x="880" y="635" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">result size</text>
<rect x="380.0" y="704.0" width="240" height="52" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.4"/>
<text x="500" y="727" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">rows inline</text>
<text x="500" y="744" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">text cells arrive as data:«…» — evidence, not instructions</text>
<rect x="970.0" y="702.0" width="320" height="56" rx="10" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.4"/>
<text x="1130" y="727" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">handle _r_n (temp table)</text>
<text x="1130" y="744" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">rows · columns · 3 samples · owner · created_at · TTL = this session</text>
<rect x="980.0" y="559.0" width="300" height="52" rx="10" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.4"/>
<text x="1130" y="582" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">fetch_source (gateway)</text>
<text x="1130" y="599" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">non-lake rows · caller&#x27;s token · untrusted content</text>
<rect x="760.0" y="806.0" width="240" height="48" rx="10" fill="#FFFFFF" stroke="#C9D3DF" stroke-width="1.4"/>
<text x="880" y="835" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">Claude reads the result</text>
<rect x="570.0" y="904.0" width="620" height="56" rx="10" fill="#F3EDFF" stroke="#8C4FFF" stroke-width="1.4"/>
<text x="880" y="929" text-anchor="middle" font-size="13" font-weight="700" fill="#16202E">old results → one line pointing at _r_n</text>
<text x="880" y="946" text-anchor="middle" font-size="10.5" font-weight="400" fill="#5A6B7B">when history reaches 60 % of the model window · superseded first · current turn untouched</text>
