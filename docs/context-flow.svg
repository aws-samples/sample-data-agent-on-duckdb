<title>Context layer — the path of one statement</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1400" height="1000" fill="#FBFCFE"/>
<text x="40" y="36" text-anchor="start" font-size="20" font-weight="800" fill="#16202E">Context layer — the path of one statement</text>
<text x="40" y="58" text-anchor="start" font-size="11.5" font-weight="400" fill="#5A6B7B">four mechanisms, in the order they act · solid = the statement and its result · dashed = a pointer into the engine, no data moves</text>
